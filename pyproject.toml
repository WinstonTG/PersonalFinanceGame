[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-game"
version = "0.1.0"
description = "A month-by-month personal finance game simulation engine."
requires-python = ">=3.11"
dependencies = ["pypdf==6.19.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
